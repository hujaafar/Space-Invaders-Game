name: Bug report
description: Report a gameplay or interface issue.
title: '[Bug] '
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include difficulty, wave, controls used, and the steps leading to the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome on Windows, Safari on iPhone, etc.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional context
      description: Add a screenshot or console error if available.
